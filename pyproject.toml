[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpilot-ai"
version = "0.1.0"
description = "Production-oriented agentic customer support portfolio MVP"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.0.57",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "python-multipart==0.0.33",
    "PyMuPDF==2.1.0",
    "qdrant-client[fastembed]==1.20.0",
    "httpx==0.28.1",
    "langgraph==1.2.20",
    "langchain-core==1.7.7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
